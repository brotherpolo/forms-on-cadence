<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171a23">
  <script>
    // Light / Dark chosen on this device (src/theme.js); applied before anything draws
    try { var t = localStorage.getItem('fw.theme'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#171a23' : '#ffffff'; }); } } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Formwright">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Formwright</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="auth" hidden></div>
  <div class="app" id="app" hidden>
    <aside class="side" id="side"></aside>
    <div class="scrim" id="scrim" data-act="close-menu"></div>
    <div style="min-width:0">
      <div class="topbar"><button class="menu-btn" data-act="menu" aria-label="Open menu"><i></i></button><b id="topttl">Formwright</b></div>
      <main id="main"></main>
    </div>
  </div>
  <div class="boot" id="boot">Loading…</div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // lets Android install Formwright as an app (see public/sw.js)
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
